name: prueba-tecnica-dotnet

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Dev_Passw0rd_2026}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    command: sleep infinity
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  nuget-cache:
